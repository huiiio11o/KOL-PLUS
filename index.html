<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOL Collection App v6.4 - Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            light: '#F2E9E4',
                            dark: '#22223B',
                            accent: '#9A8C98',
                            soft: '#C9ADA7',
                            green: '#84A98C', // 莫蘭迪綠
                            'green-light': '#CAD2C5' // 莫蘭迪淺綠
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [v-cloak] { display: none; }
        body { font-family: 'Noto Sans TC', sans-serif; transition: background-color 0.4s ease; overflow-x: hidden; font-size: 1.125rem; }
        .font-kol { font-family: 'Dancing Script', cursive; }
        .glass { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .dark .glass { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-radius: 2rem; border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.05); }
        .dark .glass-card { background: rgba(40, 40, 60, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-active { border: 2px solid #9A8C98; box-shadow: 0 0 15px rgba(154, 140, 152, 0.4); color: #9A8C98; font-weight: bold; }
        input, select, textarea { background: #ffffff; border-radius: 1.25rem; border: 2px solid rgba(154, 140, 152, 0.3); padding: 18px; outline: none; width: 100%; font-size: 1.15rem !important; color: #22223B; }
        .dark input, .dark select, .dark textarea { background: #2D3047; border: 2px solid rgba(255, 255, 255, 0.1); color: #F2E9E4; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 1.1rem; color: #4A4E69; }
        .dark label { color: #C9ADA7; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-morandi-light text-slate-700 dark:bg-morandi-dark dark:text-gray-100 min-h-screen">

<div id="app" v-cloak class="pb-28">
    <header class="p-4 px-6 text-center">
        <div class="flex justify-between items-center mb-2">
            <button @click="toggleDarkMode" class="w-10 h-10 rounded-full glass flex items-center justify-center active:scale-90 transition">
                <i v-if="isDark" class="fas fa-sun text-yellow-300 text-xl"></i>
                <i v-else class="fas fa-moon text-slate-500 text-xl"></i>
            </button>
            <div class="flex gap-2">
                <div class="glass px-4 py-1.5 rounded-full text-xs font-bold">總數: {{ kols.length }}</div>
                <button @click="ui.syncModal = true" class="bg-morandi-green text-white px-4 py-1.5 rounded-full text-xs flex items-center gap-2 shadow-lg active:scale-95 transition font-bold">
                    <i class="fas fa-cloud-upload-alt"></i> 同步
                </button>
            </div>
        </div>
        <h1 class="font-kol italic text-6xl w-full text-morandi-accent opacity-90 my-1 select-none flex justify-between px-2">
            <span>K</span><span>O</span><span>L</span>
        </h1>
    </header>

    <nav class="flex justify-center gap-4 px-6 mb-4">
        <button @click="ui.tab = 'list'" :class="ui.tab === 'list' ? 'tab-active' : 'glass'" class="flex-1 py-4 rounded-2xl flex items-center justify-center gap-2 text-lg">
            <i class="fas fa-th-list"></i> 列表
        </button>
        <button @click="ui.tab = 'calendar'" :class="ui.tab === 'calendar' ? 'tab-active' : 'glass'" class="flex-1 py-4 rounded-2xl flex items-center justify-center gap-2 text-lg">
            <i class="fas fa-calendar-day"></i> 統計
        </button>
    </nav>

    <main v-show="ui.tab === 'list'" class="px-6 space-y-6">
        <section class="glass-card overflow-hidden">
            <div @click="ui.showFilterSystem = !ui.showFilterSystem" class="p-4 flex justify-between items-center cursor-pointer bg-black/5 dark:bg-white/5 active:bg-black/10">
                <span class="font-bold"><i class="fas fa-filter mr-2 text-morandi-accent"></i>篩選網紅</span>
                <i :class="ui.showFilterSystem ? 'fa-chevron-up' : 'fa-chevron-down'" class="fas text-sm opacity-50"></i>
            </div>
            <div v-show="ui.showFilterSystem" class="p-6 space-y-8 border-t border-morandi-accent/10">
                <div>
                    <label class="text-morandi-accent text-sm">分類標籤</label>
                    <div class="flex flex-wrap gap-2 mt-2">
                        <button v-for="cat in allCategories" @click="toggleFilterTag(cat)"
                            :class="filterState.tags.includes(cat) ? 'bg-morandi-accent text-white shadow-md' : 'border border-morandi-accent/30 text-morandi-accent opacity-60'"
                            class="text-xs px-4 py-2 rounded-full font-bold transition"># {{cat}}</button>
                    </div>
                </div>
            </div>
        </section>

        <div v-for="kol in filteredKols" :key="kol.id" class="glass-card p-6 border-l-[6px] transition-all" :style="{ borderLeftColor: kol.synced ? '#84A98C' : '#9A8C98' }">
            <div class="flex justify-between items-start">
                <div class="flex-1">
                    <div class="flex items-center gap-3 mb-2">
                        <h3 class="text-2xl font-bold">{{ kol.name }}</h3>
                        <span v-if="kol.synced" class="text-[10px] text-white bg-[#84A98C] px-2 py-0.5 rounded-full flex items-center font-bold">
                            <i class="fas fa-check-double mr-1"></i> 已同步
                        </span>
                        <a :href="kol.url" target="_blank" class="text-morandi-accent text-2xl ml-auto"><i :class="getPlatformIcon(kol.url)"></i></a>
                    </div>
                    <div class="text-xs opacity-40 mb-3">{{ kol.createdAt }}</div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="text-xs px-3 py-1 rounded-full bg-slate-200/60 dark:bg-slate-700/60 font-bold">{{ kol.rank }}</span>
                        <span v-for="tag in kol.tags" class="text-xs px-3 py-1 rounded-full border border-morandi-accent text-morandi-accent font-bold">#{{ tag }}</span>
                    </div>
                    <p class="text-sm opacity-70 italic">{{ kol.note || '無備註資訊' }}</p>
                </div>
                <div class="flex flex-col gap-5 ml-4">
                    <button @click="editKol(kol)" class="text-slate-400 hover:text-blue-500 text-lg"><i class="fas fa-edit"></i></button>
                    <button @click="deleteKol(kol.id)" class="text-slate-400 hover:text-red-500 text-lg"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>
    </main>

    <main v-show="ui.tab === 'calendar'" class="px-6">
        <div class="glass-card p-6">
            <div class="flex justify-between items-center mb-6">
                <button @click="changeMonth(-1)" class="w-10 h-10 glass rounded-full flex items-center justify-center"><i class="fas fa-chevron-left"></i></button>
                <h2 class="text-xl font-bold text-morandi-accent">{{ calendarTitle }}</h2>
                <button @click="changeMonth(1)" class="w-10 h-10 glass rounded-full flex items-center justify-center"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="grid grid-cols-7 gap-2 text-center opacity-40 text-xs font-bold mb-2">
                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
            </div>
            <div class="grid grid-cols-7 gap-2">
                <div v-for="date in calendarDays" :key="date.full" :class="[date.isCurrentMonth ? '' : 'opacity-10', date.count > 0 ? 'bg-morandi-green text-white shadow-lg' : 'glass']" class="h-14 rounded-xl flex flex-col items-center justify-center transition-all">
                    <span class="text-xs font-bold">{{ date.day }}</span>
                    <span v-if="date.count > 0" class="text-[10px] font-black">{{ date.count }}</span>
                </div>
            </div>
        </div>
    </main>

    <button @click="openModal" class="fixed bottom-10 right-6 w-20 h-20 bg-morandi-accent text-white rounded-full flex items-center justify-center text-3xl shadow-xl active:scale-90 transition z-50">
        <i class="fas fa-plus"></i>
    </button>

    <div v-if="ui.modal" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-md" @click="ui.modal = false"></div>
        <div class="glass-card w-full max-w-xl p-8 relative z-[101] max-h-[90vh] overflow-y-auto rounded-t-[3rem] sm:rounded-[3rem] animate-slide-up">
            <h2 class="text-2xl font-black mb-6">{{ form.id ? '編輯網紅' : '新增網紅' }}</h2>
            <div class="space-y-6">
                <div><label>網站連結</label><input v-model="form.url" type="text" placeholder="貼上網址..."><button @click="autoFill" class="w-full mt-2 bg-morandi-accent text-white py-3 rounded-2xl font-bold">自動解析帳號</button></div>
                <div><label>帳號名稱</label><input v-model="form.name" type="text"></div>
                <div><label>主要平台</label><input v-model="form.platform" type="text"></div>
                <div><label>網紅等級</label><select v-model="form.rank"><option v-for="r in rankOptions" :value="r.name">{{r.name}}</option></select></div>
                <div><label>標籤</label><div class="flex flex-wrap gap-2 mb-2"><span v-for="t in form.tags" @click="removeTag(t)" class="bg-morandi-accent text-white px-3 py-1 rounded-full text-xs cursor-pointer">#{{t}} ✕</span></div><input v-model="ui.tempTag" @keyup.enter="addTag" type="text" placeholder="輸入後按回車..."></div>
                <div><label>備註</label><textarea v-model="form.note" rows="2"></textarea></div>
                <button @click="saveKol" class="w-full py-5 bg-morandi-accent text-white rounded-2xl font-black text-xl shadow-lg active:scale-95 transition">儲存資料</button>
            </div>
        </div>
    </div>

    <div v-if="ui.syncModal" class="fixed inset-0 z-[110] flex items-center justify-center p-6">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-md" @click="ui.syncModal = false"></div>
        <div class="glass-card w-full max-w-md p-8 relative z-[111] text-center">
            <h2 class="text-2xl font-black mb-4">同步雲端</h2>
            <p class="mb-6 font-bold text-morandi-green">待同步：{{ unsyncedKols.length }} 筆</p>
            <div class="grid grid-cols-1 gap-3 mb-6">
                <button v-for="u in ['媽咪','Winnie','蟬說']" @click="syncUser = u" :class="syncUser === u ? 'bg-morandi-accent text-white shadow-md' : 'glass'" class="py-4 rounded-xl font-bold transition">{{u}}</button>
            </div>
            <input v-model="syncUserCustom" type="text" placeholder="或自訂更新者..." class="mb-6 text-center">
            <button @click="executeSync" :disabled="ui.syncing || unsyncedKols.length === 0" class="w-full py-5 bg-morandi-green text-white rounded-2xl font-black text-xl disabled:opacity-30 active:scale-95 transition">
                {{ ui.syncing ? '同步中...' : '確認發送' }}
            </button>
        </div>
    </div>

    <div v-if="ui.toast" class="fixed top-10 left-1/2 -translate-x-1/2 z-[200] bg-slate-800 text-white px-8 py-4 rounded-full shadow-2xl font-bold animate-pulse">{{ ui.toastMsg }}</div>
</div>

<script>
    const { createApp, ref, reactive, computed, onMounted } = Vue;

    createApp({
        setup() {
            const isDark = ref(localStorage.getItem('theme') === 'dark');
            const kols = ref(JSON.parse(localStorage.getItem('kols') || '[]'));
            const allCategories = ref(['親子', '旅遊', '美食', '穿搭', '美妝', '生活', '科技']);
            const rankOptions = [{name:'寶寶網紅'}, {name:'一般網紅'}, {name:'大網紅'}, {name:'鑽石級網紅'}];
            const viewDate = ref(new Date());

            const ui = reactive({ tab: 'list', modal: false, syncModal: false, syncing: false, showFilterSystem: false, tempTag: '', toast: false, toastMsg: '' });
            const filterState = reactive({ tags: [], ranks: [] });
            const form = reactive({ id: null, name: '', url: '', platform: '', rank: '寶寶網紅', tags: [], note: '', createdAt: '', synced: false });
            const syncUser = ref('媽咪');
            const syncUserCustom = ref('');

            const unsyncedKols = computed(() => kols.value.filter(k => !k.synced));
            const calendarTitle = computed(() => `${viewDate.value.getFullYear()} 年 ${viewDate.value.getMonth() + 1} 月`);
            
            const filteredKols = computed(() => {
                let res = [...kols.value];
                if (filterState.tags.length > 0) res = res.filter(k => k.tags.some(t => filterState.tags.includes(t)));
                return res.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            });

            const toggleFilterTag = (tag) => {
                const idx = filterState.tags.indexOf(tag);
                if (idx > -1) filterState.tags.splice(idx, 1); else filterState.tags.push(tag);
            };

            const autoFill = () => {
                if (!form.url) return;
                try {
                    const url = new URL(form.url.startsWith('http') ? form.url : 'https://' + form.url);
                    const host = url.hostname.toLowerCase();
                    const path = url.pathname.split('/').filter(p => p);
                    if (host.includes('instagram')) { form.platform = 'Instagram'; form.name = '@' + (path[0] || '帳號'); }
                    else if (host.includes('facebook')) { form.platform = 'Facebook'; form.name = path[0] || 'FB粉專'; }
                    else { form.platform = '其他'; form.name = host; }
                } catch(e) { alert('網址無效'); }
            };

            const saveKol = () => {
                if (!form.name || !form.url) return alert('必填未填');
                
                // 重複檢查
                const dupIdx = kols.value.findIndex(k => k.url === form.url && k.id !== form.id);
                if (dupIdx > -1) {
                    if (!confirm(`偵測到重複連結：${kols.value[dupIdx].name}\n是否要刪除原資料並覆蓋？`)) return;
                    kols.value.splice(dupIdx, 1);
                }

                if (form.id) {
                    const i = kols.value.findIndex(k => k.id === form.id);
                    kols.value[i] = { ...form, synced: false };
                } else {
                    kols.value.unshift({ ...form, id: Date.now(), createdAt: new Date().toLocaleString('zh-TW',{hour12:false}), synced: false });
                }
                localStorage.setItem('kols', JSON.stringify(kols.value));
                ui.modal = false;
                showToast('已儲存資料');
            };

            const executeSync = async () => {
                if (unsyncedKols.value.length === 0) return;
                ui.syncing = true;
                const updater = syncUserCustom.value || syncUser.value;
                const scriptUrl = 'https://script.google.com/macros/s/AKfycbzAFMdwbeGbh7FO-3HH638NSrDg8SXlTpnNIgKTdvmUM8MPN3g3ipqHLuPTXjCBTpg/exec';
                
                const dataToSync = unsyncedKols.value.map(k => ({
                    time: k.createdAt,
                    mainPlatform: k.platform,
                    name: k.name,
                    tier: k.rank,
                    category: k.tags.join(','),
                    link: k.url,
                    updater: updater, // 這裡傳遞更新者名稱給後端
                    note: k.note
                }));

                try {
                    // 使用 no-cors 盲發，注意：後端 GAS 腳本也必須能解析 JSON.parse(e.postData.contents)
                    await fetch(scriptUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(dataToSync) });
                    kols.value.forEach(k => { if(!k.synced) k.synced = true; });
                    localStorage.setItem('kols', JSON.stringify(kols.value));
                    alert(`同步發送完成！筆數：${dataToSync.length}\n請至試算表確認是否寫入成功。`);
                    ui.syncModal = false;
                } catch (e) { 
                    alert('網路傳輸發生錯誤'); 
                } finally { 
                    ui.syncing = false; 
                }
            };

            const deleteKol = (id) => { if(confirm('確定刪除？')){ kols.value = kols.value.filter(k => k.id !== id); localStorage.setItem('kols', JSON.stringify(kols.value)); } };
            const toggleDarkMode = () => { isDark.value = !isDark.value; document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', isDark.value?'dark':'light'); };
            const getPlatformIcon = (url) => { if(url.includes('instagram')) return 'fab fa-instagram'; if(url.includes('facebook')) return 'fab fa-facebook'; return 'fas fa-link'; };
            const showToast = (m) => { ui.toastMsg = m; ui.toast = true; setTimeout(()=>ui.toast=false, 2000); };
            const openModal = () => { Object.assign(form, { id:null, name:'', url:'', platform:'', rank:'寶寶網紅', tags:[], note:'', synced:false }); ui.modal = true; };
            const editKol = (k) => { Object.assign(form, JSON.parse(JSON.stringify(k))); ui.modal = true; };
            const addTag = () => { if(ui.tempTag && !form.tags.includes(ui.tempTag)){ form.tags.push(ui.tempTag); ui.tempTag=''; } };
            const removeTag = (t) => { form.tags = form.tags.filter(tag => tag !== t); };
            const changeMonth = (d) => { viewDate.value = new Date(viewDate.value.getFullYear(), viewDate.value.getMonth() + d, 1); };

            const calendarDays = computed(() => {
                const y = viewDate.value.getFullYear(), m = viewDate.value.getMonth();
                const start = new Date(y, m, 1), end = new Date(y, m + 1, 0);
                const res = [];
                for(let i=0; i<start.getDay(); i++) res.push({ day:'', full:'p'+i, count:0, isCurrentMonth:false });
                for(let i=1; i<=end.getDate(); i++) {
                    const dateStr = new Date(y, m, i).toLocaleDateString();
                    const count = kols.value.filter(k => new Date(k.createdAt).toLocaleDateString() === dateStr).length;
                    res.push({ day:i, full:dateStr, count, isCurrentMonth:true });
                }
                return res;
            });

            onMounted(() => { if(isDark.value) document.documentElement.classList.add('dark'); });

            return { isDark, kols, ui, form, filterState, rankOptions, allCategories, calendarTitle, filteredKols, unsyncedKols, calendarDays, syncUser, syncUserCustom, toggleDarkMode, openModal, editKol, deleteKol, saveKol, executeSync, getPlatformIcon, autoFill, addTag, removeTag, changeMonth, toggleFilterTag };
        }
    }).mount('#app');
</script>

<style>
    @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
</style>
</body>
</html>
